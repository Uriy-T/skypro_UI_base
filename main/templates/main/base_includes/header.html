<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 me-md-3 font-weight-normal">Mega trading</h5>
    <nav class="d-flex flex-wrap align-items-center gap-2 flex-grow-1">

        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:category_list' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'blog:article_list' %}">Блог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'main:contacts' %}">Контакты</a>
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:category_create' %}#">Создать категорию</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_create' %}">Создать товар</a>
        <form method="post" action="{% url 'users:logout' %}" class="ms-auto m-0">
            {% csrf_token %}
            <a href="{% url 'users:update_profile' %}" class="p-2 btn btn-outline-primary ms-auto">Личный кабинет</a>
            <button type="submit" class="p-2 btn btn-outline-primary ms-auto">Выйти</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary ms-auto" href="{% url 'users:login' %}">Вход</a>
        {% endif %}
    </nav>
</div>
