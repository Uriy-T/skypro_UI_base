{% extends 'main/main.html' %}

{% block title%}Редактирование статьи{% endblock%}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h3 class="display-4">Редактировать статью "{{article.title}}"</h3>
</div>

<div class="card-body w-75 mx-auto">
    <form method="post" action="" class="form-floating" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="title">Название статьи</label>
            <input type="text" name="title" class="form-control" id="title"
                   value="{{article.title}}" required>
        </div>
        <div class="mb-3">
            <label for="content">Содержание статьи</label>
            <textarea type="text" name="content" class="form-control" id="content">{{article.content}}</textarea>
        </div>
        <div class="mb-3">
            <label for="preview_image">Превью фото статьи</label>
            {% if article.preview_image %}
            <div class="mb-2">
                <p class="text-muted small mb-1">Текущее фото:</p>
                <img src="{{ article.preview_image.url }}"
                     alt="{{ article.title }}"
                     style="max-width: 200px; max-height: 200px; object-fit: cover;">
            </div>
            {% else %}
            <p class="text-muted small">Фото не загружено.</p>
            {% endif %}
            <input type="file" name="preview_image" id="preview_image" accept=".png, .jpg, .jpeg, .webp">
        </div>
        <div class="form-check mb-3">
            <label for="is_public">Опубликовать</label>
            <input type="checkbox" name="is_public" class="form-check-input" id="is_public"
                   {% if article.is_public %}
                   checked
                   {% endif %}>
        </div>
        <button type="submit" class="btn btn-lg btn-block btn-success">Сохранить</button>
        <a href="{% url 'blog:article_detail' article.pk%}" class="btn btn-lg btn-danger">Отменить</a>
    </form>
</div>

{% endblock %}
