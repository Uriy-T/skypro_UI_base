{% extends 'main/main.html' %}

{% block title%}Создание статьи{% endblock%}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h3 class="display-4">Создать статью</h3>
</div>

<div class="card-body w-75 mx-auto" >
    <form method="post" action="" class="form-floating" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="title">Название статьи</label>
            <input type="text" name="title" class="form-control" id="title"
                   placeholder="Введите название статьи" required>
        </div>
        <div class="mb-3">
            <label for="content">Содержание статьи</label>
            <textarea type="text" name="content" class="form-control" id="content">
            </textarea>
        </div>
        <div class="mb-3">
            <label for="preview_image">Превью фото статьи</label>
            <input type="file" name="preview_image" id="preview_image" accept=".png, .jpg, .jpeg, .webp">
        </div>
        <div class="form-check mb-3">
            <label for="is_public">Опубликовать</label>
            <input type="checkbox" name="is_public" class="form-check-input" id="is_public">
        </div>
        <button type="submit" class="btn btn-lg btn-block btn-success">Создать статью</button>
        <a href="{% url 'blog:article_list' %}" class="btn btn-lg btn-danger">Отменить</a>
    </form>
</div>

{% endblock %}
