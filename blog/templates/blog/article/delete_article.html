{% extends 'main/main.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h3 class="display-4">Удаление статьи</h3>
    <p class="lead">Вы уверены, что хотите удалить статью "{{article.title}}"?</p>
</div>
<form method="post" class="form-floating">

    {% csrf_token %}
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Удалить</button>
        <a href="{% url 'blog:article_detail' article.pk %}" class="btn btn-danger">Отменить</a>
    </div>
</form>

{% endblock%}
