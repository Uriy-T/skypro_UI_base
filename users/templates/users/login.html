{% extends 'main/main.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h3 class="display-4">Вход</h3>
</div>

<div class="card-body w-25 mx-auto">
    <form method="post" action="">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-block btn-success">Авторизация</button>
        <h6 class="display-7 mt-2 mb-2">Нет аккаунта?</h6>
        <a href="{% url 'users:register' %}" class="btn btn-block btn-primary">Зарегистрироваться</a>
    </form>
</div>

{% endblock %}
