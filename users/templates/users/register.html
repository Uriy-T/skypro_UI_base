{% extends 'main/main.html' %}

{% block title%}Регистрация{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h3 class="display-4">Регистрация</h3>
</div>

<div class="card-body w-25 mx-auto" >
    <form method="post" action="" class="form-floating" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-lg btn-block btn-success">Зарегистрироваться</button>
        <a href="{% url 'catalog:category_list' %}" class="btn btn-lg btn-block btn-danger">Отмена</a>
    </form>
</div>

{% endblock %}
