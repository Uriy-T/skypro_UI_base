{% extends 'main/main.html' %}

{% block title %}Удаление категории{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h3 class="display-4">Удаление категории</h3>
    <p class="lead">Вы уверены, что хотите удалить категорию товаров "{{category.category_name}}"? Все товары данной категории так же будут удалены!</p>
</div>
<form method="post" class="form-floating">

    {% csrf_token %}
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Удалить</button>
        <a href="{% url 'catalog:category_detail' category.pk %}" class="btn btn-danger">Отменить</a>
    </div>
</form>

{% endblock%}
