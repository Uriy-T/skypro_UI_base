{% extends 'main/main.html'%}

{% block title %}Категории товаров{%endblock%}

{% block content%}
<div class="container">
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Категории товаров</h1>
        <p class="lead">Ознакомьтесь с нашим ассортиментом</p>
    </div>

    <div class="row text-center">
        {% for category in categories%}
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{category.category_name}}</h4>
                </div>
                <div class="card-body">
                    <p class="list-unstyled mt-3 mb-4 text-start m-3">{{ category.description|truncatechars:50 }}</p>
                    <a href="{% url 'catalog:category_detail' category.pk %}">
                        <button type="button" class="btn btn-lg btn-block btn-outline-primary">Перейти</button>
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
