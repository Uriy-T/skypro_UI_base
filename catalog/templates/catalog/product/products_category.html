{% extends 'main/main.html'%}

{% block title %}Категории товаров{%endblock%}

{% block content%}
<div class="container">
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Товары категории {{category}}</h1>
        <p class="lead">Все свежее, вкусное, полезное</p>
    </div>

    <div class="row text-center g-4">
        {% for product in products %}
        <div class="col-12 col-sm-6 col-md-4 col-lg-3 d-flex">
            <div class="card mb-4 box-shadow w-100 h-100">
                <div style="height: 250px; overflow: hidden;">
                    <img src="{{ product.product_image.url }}"
                         class="w-100 h-100 object-fit-cover"
                         alt="{{ product.product_name }}">

                </div>
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ product.product_name }}</h4>
                </div>

                <div class="card-body d-flex flex-column">
                    <p class="mt-3 mb-4 text-start m-3">
                        Цена: {{ product.price_per_unit }} ₽
                    </p>
                    <a href="{% url 'catalog:product_detail' product.pk %}">
                        <button type="button"
                                class="btn btn-lg btn-block btn-outline-primary mt-auto">
                            Открыть
                        </button>
                    </a>
                </div>

            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
