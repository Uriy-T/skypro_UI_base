{% extends 'main/main.html' %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h3 class="display-4">Редактировать товар</h3>
</div>

<div class="card-body w-25 mx-auto">
    <form method="post" action="" class="form-floating" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="product_name">Название продукта</label>
            <input type="text" name="product_name" class="form-control" id="product_name"
                   value="{{product.product_name}}" required>
        </div>
        <div class="mb-3">
            <label for="description">Описание продукта</label>
            <textarea type="text" name="description" class="form-control" id="description">{{product.description}}</textarea>
        </div>
        <div class="mb-3">
            <label for="product_image">Фото продукта</label>
            {% if product.product_image %}
            <div class="mb-2">
                <p class="text-muted small mb-1">Текущее фото:</p>
                <img src="{{ product.product_image.url }}"
                     alt="{{ product.product_name }}"
                     style="max-width: 200px; max-height: 200px; object-fit: cover;">
            </div>
            {% else %}
            <p class="text-muted small">Фото не загружено.</p>
            {% endif %}
            <input type="file" name="product_image" id="product_image" accept=".png, .jpg, .jpeg, .webp">
        </div>

        <div class="mb-3">
            <label for="product_category">Категория продукта</label>
            <select name="product_category" id="product_category" class="form-select" required>
                {% for category in categories %}
                <option value="{{ category.pk }}"
                        {% if category.pk == product.product_category_id %}selected{% endif %}>{{category.category_name}}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="price_per_unit">Цена продукта</label>
            <input type="text" name="price_per_unit" class="form-control" id="price_per_unit" value="{{product.price_per_unit}}"
                   required>
        </div>
        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Сохранить</button>
        <a href="{% url 'catalog:product_detail' product.id%}" class="btn btn-lg btn-danger">Отменить</a>
    </form>
</div>

{% endblock %}
