{% extends 'main/main.html' %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h3 class="display-4">Редактировать товар</h3>
</div>

<div class="card-body w-25 mx-auto">
    <form method="post" action="" class="form-floating" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            {% if form.instance.product_image %}
            <div class="mb-2">
                <p class="text-muted small mb-1">Текущее фото:</p>
                <img src="{{ form.instance.product_image.url }}"
                     alt="{{ form.instance.product_name }}"
                     style="max-width: 200px; max-height: 200px; object-fit: cover;">
            </div>
            {% else %}
            <p class="text-muted small">Фото не загружено.</p>
            {% endif %}
        </div>
        {{form.as_p}}
        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Сохранить</button>
        <a href="{% url 'catalog:product_detail' product.id%}" class="btn btn-lg btn-danger">Отменить</a>
    </form>
</div>

{% endblock %}
