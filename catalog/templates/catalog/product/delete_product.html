{% extends 'main/main.html' %}

{% block title %}Удаление продукта{% endblock %}

{% block content %}
<div class="container">
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h3 class="display-4">Удаление продукта</h3>
        <p class="lead">Вы уверены, что хотите удалить продукт "{{product.product_name}}"?</p>
    </div>
    <form method="post" class="form-floating">

        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Удалить</button>
            <a href="{% url 'catalog:product_detail' product.id %}" class="btn btn-danger">Отменить</a>
        </div>
    </form>
</div>
{% endblock%}
